[project]
name = "tilawa-studio"
version = "0.1.0"
description = "Turn Quran recitation videos into subtitled Shorts (Arabic, French, phonetic) with automatic verse timing."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "numpy>=1.26",
    "soundfile>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "playwright>=1.47",
    "yt-dlp>=2025.1.1",
    "certifi",
    "static-ffmpeg>=2.7",
    "numba>=0.68.0",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pywebview>=6.2.1",
]

[project.scripts]
tilawa = "tilawa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tilawa"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
