<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!--
  The overlay drawn on top of the video. Used twice:
    * by the renderer (headless Chromium -> transparent PNGs), and
    * by the editor, inside an <iframe> over the video, for a live preview.
  Layout is defined on a canvas per format (1080 x 1920 for 9:16, 1920 x 1080
  for 16:9...) and scaled to the output size. Everything the editor can
  change is a CSS variable (setStyle).
-->
<style>
  :root {
    --latin: "Comic Neue", "Comic Sans MS", system-ui, sans-serif;
    --title-font: var(--latin);
    --text-font: var(--latin);
    --arabic: "Amiri Quran";
    --outline: #0b0b0d;
    --title-grad: linear-gradient(90deg, #f07ad6 0%, #c79ee0 38%, #a9bfe0 62%, #86dde6 100%);
    --reciter-grad: linear-gradient(90deg, #86dccb 0%, #b4b0aa 55%, #e6a1a5 100%);
    --white: #f6f6f8;
    --phonetic: #f3df8f;
    --hl-grad: linear-gradient(90deg, #ef86d6 0%, #b9a8de 50%, #82dcdb 100%);
    --hl-arabic-grad: linear-gradient(90deg, #7fded0 0%, #a9c6c4 50%, #e3a6a6 100%);
    --hl-phonetic: #f09aa4;
    /* text sizes */
    --title-size: 64px; --reciter-size: 34px; --num-size: 34px; --fr-size: 35px; --ar-size: 42px; --tr-size: 29px;
    /* placement (9:16; other formats in LAYOUTS below), changed by dragging the texts in the editor */
    --header-top: 140px; --header-x: 0px; --header-zoom: 1;
    --block-top: 1188px; --block-x: 0px; --block-zoom: 1;
    --block-side: 70px; --fr-width: 900px; --ar-width: 920px; --tr-width: 940px;
    --fr-gap: 10px; --ar-gap: 30px; --tr-gap: 60px;
  }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: 1080px; height: 1920px; overflow: hidden; position: relative; transform-origin: 0 0; }

  /* Outlined text: every text is two stacked copies. The lower one (.o)
     carries the outline and shadow; the upper one (.f) the fill, flat or
     gradient, so the fill stays crisp on top of the outline. */
  .ol { position: relative; display: inline-block; }
  .ol > .o, .ol > .f { display: block; }
  .ol > .o {
    position: absolute; inset: 0; color: var(--outline);
    -webkit-text-stroke: var(--sw, 6px) var(--outline);
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .55));
  }
  .ol > .f { position: relative; }
  .grad > .f { background: var(--g); -webkit-background-clip: text; background-clip: text; color: transparent; }

  #header { position: absolute; top: var(--header-top); left: 0; right: 0; text-align: center; transform: translateX(var(--header-x)); }
  #header > .zoom { zoom: var(--header-zoom); }
  #block > .zoom { zoom: var(--block-zoom); }
  #title { font: 700 var(--title-size)/1.1 var(--title-font); letter-spacing: .5px; --g: var(--title-grad); --sw: 7px; white-space: nowrap; }
  #reciter { font: 700 var(--reciter-size)/1.2 var(--title-font); --g: var(--reciter-grad); --sw: 5px; }
  #reciter-line { margin-top: 30px; }
  #mic { font-size: calc(var(--reciter-size) * .88); margin-right: 10px; vertical-align: 4px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }

  #block { position: absolute; top: var(--block-top); left: var(--block-side); right: var(--block-side); text-align: center; transform: translateX(var(--block-x)); }
  #block[hidden] { display: none; }
  #num-line { display: var(--num-display, block); }
  #num { font: 400 var(--num-size)/1 var(--text-font); color: var(--num-color, var(--white)); --sw: 5px; }
  #fr-box { min-height: calc(var(--fr-size) * 2.46); display: flex; align-items: center; justify-content: center; margin-top: var(--fr-gap); }
  #fr { font: 400 var(--fr-size)/1.18 var(--text-font), "Nunito", "Noto Naskh Arabic", sans-serif; color: var(--fr-color, var(--white));
        --sw: 5px; max-width: var(--fr-width); text-wrap: balance; white-space: pre-line; }
  #fr[dir=rtl] { line-height: 1.6; }
  #ar-box { margin-top: var(--ar-gap); min-height: calc(var(--ar-size) * 1.9); display: flex; align-items: center; justify-content: center; }
  #ar { font: 400 var(--ar-size)/1.75 var(--arabic), "Amiri Quran", serif; direction: rtl; color: var(--ar-color, var(--white)); --sw: 5px; max-width: var(--ar-width); text-wrap: balance; }
  #ar .ayah { font-family: var(--ayah-font, "Amiri Quran"); white-space: nowrap; }
  #tr-line { display: var(--tr-display, block); }
  #tr { margin-top: var(--tr-gap); font: 400 var(--tr-size)/1.2 var(--text-font), "Nunito", sans-serif; color: var(--tr-color, var(--phonetic)); --sw: 4px; max-width: var(--tr-width); text-wrap: balance; }

  #block.hl #num { color: #ef8fb8; }
  #block.hl #fr { --g: var(--hl-grad); }
  #block.hl #ar { --g: var(--hl-arabic-grad); }
  #block.hl #tr { color: var(--hl-phonetic); }
</style>
<style id="layout"></style>
<style id="faces"></style>
</head>
<body>
  <div id="header"><div class="zoom">
    <div><span id="title" class="ol grad"></span></div>
    <div id="reciter-line"><span id="mic">🎙️</span><span id="reciter" class="ol grad"></span></div>
  </div></div>
  <div id="block" hidden><div class="zoom">
    <div id="num-line"><span id="num" class="ol"></span></div>
    <div id="fr-box"><span id="fr" class="ol"></span></div>
    <div id="ar-box"><span id="ar" class="ol" lang="ar"></span></div>
    <div id="tr-line"><span id="tr" class="ol"></span></div>
  </div></div>
<script>
  // canvas size and default placement per format; the editor reads these too
  window.FORMATS = { "9:16": [1080, 1920], "16:9": [1920, 1080], "1:1": [1080, 1080], "4:5": [1080, 1350] };
  window.LAYOUTS = {
    "9:16": { "--header-top": 140, "--block-top": 1188 },
    "16:9": { "--header-top": 46, "--block-top": 600, "--block-side": "160px", "--fr-width": "1450px", "--ar-width": "1550px",
              "--tr-width": "1550px", "--fr-gap": "4px", "--ar-gap": "14px", "--tr-gap": "26px" },
    "1:1": { "--header-top": 56, "--block-top": 560, "--ar-gap": "18px", "--tr-gap": "34px" },
    "4:5": { "--header-top": 80, "--block-top": 760, "--ar-gap": "22px", "--tr-gap": "44px" },
  };
  let format = "9:16";
  window.setCanvas = function (fmt, height) {
    format = fmt in FORMATS ? fmt : "9:16";
    const [w, h] = FORMATS[format];
    document.body.style.width = w + "px";
    document.body.style.height = (height || h) + "px";
    const vars = Object.entries(LAYOUTS[format]).map(([k, v]) => `${k}: ${typeof v === "number" ? v + "px" : v};`).join(" ");
    document.getElementById("layout").textContent = `:root { ${vars} }`;
  };

  // fonts: the bundled ones and those imported by the user, loaded when used
  const ORNAMENT = new Set();  // Arabic fonts able to draw the verse number inside ۝
  async function loadFonts() {
    const lists = await Promise.all(["/fonts/fonts.json", "/userfonts/fonts.json"].map(u =>
      fetch(u).then(r => r.ok ? r.json() : []).catch(() => [])));
    let css = "";
    lists.forEach((list, user) => list.forEach(f => {
      for (const [file, weight] of f.files) {
        css += `@font-face { font-family: "${f.family}"; src: url("/${user ? "userfonts" : "fonts"}/${encodeURIComponent(file)}"); font-weight: ${weight}; font-display: block; }\n`;
      }
      if (f.ornament) ORNAMENT.add(f.family);
    }));
    document.getElementById("faces").textContent = css;
  }

  // text with an optional tail drawn in another font (the verse ornament)
  function setText(el, text, tail) {
    el.replaceChildren();
    for (const cls of ["o", "f"]) {
      const layer = document.createElement("span");
      layer.className = cls;
      layer.textContent = text || "";
      if (tail) {
        const t = document.createElement("span");
        t.className = "ayah"; t.textContent = tail;
        layer.append(" ", t);
      }
      el.append(layer);
    }
    el.style.display = text ? "" : "none";
  }
  const css = (k) => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const DIGITS = "٠١٢٣٤٥٦٧٨٩";
  function ornament(n) {
    const mark = css("--ayah-mark").replace(/"/g, "");
    if (!n || !mark || mark === "none") return "";
    const d = String(n).replace(/\d/g, x => DIGITS[x]);
    return mark === "brackets" ? "﴿" + d + "﴾" : "۝" + d;
  }
  function ornamentFont() {
    const fam = css("--arabic").split(",")[0].replace(/["']/g, "").trim();
    document.documentElement.style.setProperty("--ayah-font", ORNAMENT.has(fam) ? `"${fam}"` : `"Amiri Quran"`);
  }

  // When the translation needs two lines, break it after a sentence end close
  // to the middle (if both halves fit) rather than wherever the width runs out.
  const measure = document.createElement("span");
  measure.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap";
  document.body.append(measure);
  function lineWidth(t) { measure.textContent = t; return measure.getBoundingClientRect().width; }
  function sentenceBreak(text) {
    const fr = document.getElementById("fr");
    measure.style.font = getComputedStyle(fr).font;
    const max = parseFloat(getComputedStyle(fr).maxWidth) || 900;
    if (text.includes("\n") || lineWidth(text) <= max) return text;
    let best = null;
    for (const m of text.matchAll(/[.!?;»:”"۔؟](?=\s)/g)) {
      const a = text.slice(0, m.index + 1).trim(), b = text.slice(m.index + 1).trim();
      const wa = lineWidth(a), wb = lineWidth(b);
      if (wa > max || wb > max) continue;
      const balance = Math.abs(wa - wb) / (wa + wb);
      if (balance < 0.45 && (!best || balance < best.balance)) best = { a, b, balance };
    }
    return best ? best.a + "\n" + best.b : text;
  }
  // header: {title, reciter, visible}
  window.setHeader = function (h) {
    document.getElementById("header").style.display = h && h.visible !== false ? "" : "none";
    if (!h) return;
    setText(document.getElementById("title"), h.title);
    setText(document.getElementById("reciter"), h.reciter);
    document.getElementById("reciter-line").style.display = h.reciter ? "" : "none";
  };
  // block: {num, fr, ar, tr, highlight, ayah (verse number if the block ends the verse), rtl} or null
  window.setBlock = function (b) {
    const el = document.getElementById("block");
    el.hidden = !b;
    if (!b) return;
    el.classList.toggle("hl", !!b.highlight);
    const fr = document.getElementById("fr");
    fr.dir = b.rtl ? "rtl" : "auto";
    setText(document.getElementById("num"), b.num);
    setText(fr, sentenceBreak(b.fr || ""));
    ornamentFont();
    setText(document.getElementById("ar"), b.ar, ornament(b.ayah));
    setText(document.getElementById("tr"), b.tr);
    for (const id of ["fr", "ar"]) document.getElementById(id).classList.toggle("grad", !!b.highlight);
  };
  // style overrides: {"--block-top": "1150px", ...}; keys left out go back to the defaults
  window.setStyle = function (vars) {
    const root = document.documentElement.style;
    for (const k of [...root]) if (k.startsWith("--") && k !== "--ayah-font" && !(k in (vars || {}))) root.removeProperty(k);
    for (const [k, v] of Object.entries(vars || {})) root.setProperty(k, v);
  };
  window.ready = loadFonts().then(() => document.fonts.ready);
  // after a change: lay out (which starts loading the fonts in use) and wait for them
  window.settle = async function () {
    document.body.getBoundingClientRect();
    await document.fonts.ready;
    await new Promise(r => requestAnimationFrame(() => r()));
    await document.fonts.ready;
  };
</script>
</body>
</html>
